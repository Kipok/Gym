# Chain to existing resource server + agent config
config_paths:
  - resources_servers/math_with_judge/configs/math_with_judge.yaml
  - benchmarks/judge_luna.yaml

# Symbolic-first grading with Luna fallback and positive swapped-order confirmation.
apex25_math_with_judge_resources_server:
  _inherit_from: math_with_judge
  resources_servers:
    math_with_judge:
      should_use_judge: true
      judge_model_server:
        type: responses_api_models
        name: judge_model

apex25_math_with_judge_simple_agent:
  _inherit_from: math_with_judge_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: apex25_math_with_judge_resources_server
      datasets:
      - name: apex25
        type: benchmark
        jsonl_fpath: benchmarks/apex25/data/apex25_benchmark.jsonl
        prompt_config: benchmarks/apex25/prompts/default.yaml
        prepare_script: benchmarks/apex25/prepare.py
